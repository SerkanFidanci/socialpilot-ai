name: ${COMPOSE_PROJECT_NAME:-socialpilot-ai}

# Single-server resource budget (ADR-013). The product runs on one cheap dedicated box, so
# every service carries an explicit CPU ceiling (`cpus`), memory ceiling (`mem_limit`), and a
# relative CPU weight (`cpu_shares`) that arbitrates *only* when the box is saturated. Ceilings
# are deliberately oversubscribed — their sum exceeds the host's cores — because a ceiling caps
# a single service's burst while `cpu_shares` decides who yields under contention. The priority
# order the shares encode is postgres > api > valkey > workers: the system of record and the API
# must never starve, and a render/analysis burst on the workers is the first thing to brake.
# Numbers below target the low end of the intended host (6 cores / 32 GB); a 6-core box keeps
# ~1 core and the hard-limit sum (~15.6 GB) leaves the rest of 32 GB for PostgreSQL's own cache
# and the OS. cpu_shares default is 1024.

services:
  postgres:
    # PostgreSQL 18.4 — the current stable line (19 is beta at the time of writing, and this
    # repository does not run beta database servers). The Alpine variant is kept from the 16
    # line deliberately: a major-version bump already changes enough, and staying on musl keeps
    # the libc collation provider identical, so no text index changes ordering underneath us.
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: socialpilot
      POSTGRES_USER: socialpilot
      POSTGRES_PASSWORD: socialpilot_local_only
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      # PostgreSQL 18's official image moved PGDATA from /var/lib/postgresql/data to
      # /var/lib/postgresql/18/docker and declares the VOLUME one level up. The mount point
      # follows it: mounting the old path against an 18 image gives an empty, silently
      # re-initialised database rather than an error.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialpilot -d socialpilot"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend, edge]
    # System of record: highest CPU weight and the largest memory ceiling so its page cache and
    # connection workers keep RAM under load. 2 cores is enough for the MVP write volume; the
    # 8 GB ceiling caps runaway queries while leaving cache headroom on a 32 GB host.
    cpus: 2.0
    mem_limit: 8g
    mem_reservation: 2g
    cpu_shares: 2048
    restart: unless-stopped

  # Valkey, not Redis (ADR-010, decided here in W06): Redis 8 is AGPL and this is a hosted SaaS,
  # while Valkey 9.1 is BSD-3 and wire-compatible with the RESP protocol `redis-py`, kombu and
  # Celery speak. The service is named for what it runs; the application-side variable names
  # (REDIS_URL, REDIS_HOST_PORT) are app config owned by app/core/config.py and stay as they are.
  valkey:
    image: valkey/valkey:9.1.1-alpine
    command: ["valkey-server", "--appendonly", "no", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend, edge]
    # Broker and cache: light and CPU-cheap, but ranked above the workers so queue traffic keeps
    # flowing under contention. `maxmemory` (384mb) sits below the 512m container ceiling so the
    # server rejects new writes with OOM *inside* its budget instead of being SIGKILLed by the
    # cgroup; `noeviction` keeps the Celery broker from silently dropping queued jobs.
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 128m
    cpu_shares: 512
    restart: unless-stopped

  # Object storage for the direct-upload byte path. It shares the internal `backend`
  # network with the API and workers and joins `edge` only so Docker Desktop can publish
  # the loopback-only development ports; nothing here is a production deployment shape.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: socialpilot
      MINIO_ROOT_PASSWORD: socialpilot_local_only
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-59000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-59001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend, edge]
    # Local-only object storage: production uses zero-egress R2 (ADR-013), so this exists just
    # for the development byte path. Modest ceilings keep it from competing with PostgreSQL or the
    # API for RAM; weight sits above the workers because uploads must stay responsive.
    cpus: 1.0
    mem_limit: 1g
    mem_reservation: 256m
    cpu_shares: 512
    restart: unless-stopped

  # One-shot bucket provisioning. Production bucket/IAM setup is deliberately not modelled
  # here; the adapter never provisions storage itself.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    # Docker Desktop can still be attaching internal network aliases when this starts, so
    # the alias step retries instead of leaving the bucket uncreated.
    entrypoint:
      - sh
      - -c
      - |
        attempt=1
        until mc alias set local http://minio:9000 socialpilot socialpilot_local_only; do
          if [ "$$attempt" -ge 15 ]; then
            echo "minio alias unavailable after $$attempt attempts" >&2
            exit 1
          fi
          attempt=$$((attempt + 1))
          sleep 2
        done
        mc mb --ignore-existing local/socialpilot-media
    depends_on:
      minio:
        condition: service_healthy
    # `edge` is required, not cosmetic: on an internal-only network the embedded DNS cannot
    # answer this image's lookups and every `mc` call fails with SERVFAIL.
    networks: [backend, edge]
    # One-shot provisioning: tiny ceilings are ample for a few `mc` calls; lowest weight since it
    # is not on any request path. It exits after creating the bucket, so it never restarts.
    cpus: 0.5
    mem_limit: 128m
    cpu_shares: 128
    restart: "no"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      # Named explicitly, not left to default. `backup` is a later stage in the same Dockerfile,
      # and an unpinned build takes the *last* stage — which would quietly put a database client
      # into the API image and break ADR-013's "the stateless API image carries none".
      target: runtime
      args:
        INSTALL_DEV: "true"
    environment: &application_environment
      APP_ENV: development
      SERVICE_NAME: socialpilot-api
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://socialpilot:socialpilot_local_only@postgres:5432/socialpilot
      POSTGRES_PORT: 5432
      DATABASE_POOL_SIZE: 5
      DATABASE_MAX_OVERFLOW: 10
      REDIS_URL: redis://valkey:6379/0
      REDIS_PORT: 6379
      DATABASE_CONNECT_TIMEOUT_SECONDS: 5
      REDIS_CONNECT_TIMEOUT_SECONDS: 5
      REQUEST_TIMEOUT_SECONDS: 10
      CELERY_BROKER_URL: redis://valkey:6379/1
      CELERY_RESULT_BACKEND: redis://valkey:6379/2
      CELERY_TASK_TIMEOUT_SECONDS: 960
      CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: 900
      LOCAL_IDENTITY_SIGNING_KEY: development-local-identity-key-not-for-production
      # Defaults to `fake` so the opt-in integration suite keeps its in-process adapter.
      # Set STORAGE_ADAPTER=s3 in the repository-root .env for the real MinIO byte path.
      STORAGE_ADAPTER: ${STORAGE_ADAPTER:-fake}
      S3_ENDPOINT_URL: http://minio:9000
      # SigV4 binds the signature to the host the client contacts, so part URLs must be
      # signed for an address the phone or browser can actually reach.
      S3_PRESIGN_ENDPOINT_URL: ${S3_PRESIGN_ENDPOINT_URL:-http://127.0.0.1:59000}
      S3_REGION: us-east-1
      S3_BUCKET: socialpilot-media
      S3_ACCESS_KEY_ID: socialpilot
      S3_SECRET_ACCESS_KEY: socialpilot_local_only
      S3_FORCE_PATH_STYLE: "true"
      PYTEST_ADDOPTS: -p no:cacheprovider
      RUFF_CACHE_DIR: /tmp/ruff-cache
      MYPY_CACHE_DIR: /tmp/mypy-cache
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - ./services/api:/app/services/api:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [edge, backend]
    # The API must never lose the CPU to a render/analysis burst: it ranks just below PostgreSQL
    # and well above the workers (cpu_shares 1024 vs 256). No media bytes flow through it
    # (ADR-002), so 2 GB is generous for FastAPI request handling; 2 cores absorbs concurrent
    # requests without needing to match the worker's compute footprint.
    cpus: 2.0
    mem_limit: 2g
    mem_reservation: 512m
    cpu_shares: 1024
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: runtime
    environment: *application_environment
    # Concurrency 2 caps heavy FFmpeg jobs to two at a time so they fit the 2-core ceiling
    # (~1 core each) and cannot swamp the box. §38.2's per-queue profiles (a separate,
    # higher-concurrency worker for light queues such as outbox dispatch and notifications)
    # are a config addition once task routing lands — see ADR-013.
    command: ["celery", "-A", "app.infrastructure.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    profiles: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [backend]
    # Lowest CPU weight (256): under contention the workers yield to PostgreSQL, the API, and
    # Redis, and the worker process renices itself (+10, app/worker/composition.py) so its FFmpeg
    # children inherit an even lower CPU priority. 4 GB covers two concurrent frame-extraction
    # jobs plus the 512 MB tmpfs scratch (which counts against this ceiling); the application
    # scratch guard (WORKER_SCRATCH_BUDGET_EXCEEDED) trips at 3/4 of that tmpfs before ENOSPC.
    cpus: 2.0
    mem_limit: 4g
    mem_reservation: 512m
    cpu_shares: 256
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    # on-failure (not unless-stopped): a warm SIGTERM shutdown exits 0 and stays down, while a
    # crash (e.g. OOM-kill, exit 137) restarts under Docker's exponential backoff, which caps the
    # restart *rate* so an OOM loop cannot busy-spin the CPU. Plain `docker compose` has no
    # attempt cap; the production host bounds attempts with systemd StartLimitBurst (ADR-013).
    stop_grace_period: 30s
    restart: on-failure

  # Beat only emits schedule ticks; it never executes work and holds no worker adapters.
  # Development assumes exactly ONE beat replica: the schedule file is local to the
  # container, so a second replica would double every tick. The drain tasks are
  # idempotent PostgreSQL claims, so duplicate ticks stay safe, but production still
  # needs single-instance ownership or leader election (deferred to Phase 1E).
  celery-beat:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: runtime
    environment: *application_environment
    command: ["celery", "-A", "app.infrastructure.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    profiles: ["worker"]
    scale: 1
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks: [backend]
    # Beat only emits schedule ticks — near-zero CPU and RAM. Lowest weight alongside the workers;
    # same on-failure policy so a clean stop stays down and only a crash restarts (rate-capped by
    # Docker backoff).
    cpus: 0.25
    mem_limit: 128m
    cpu_shares: 128
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    stop_grace_period: 15s
    restart: on-failure

  # --- backup profile (W06, closes deployment gate D1) ---------------------------------------
  #
  # ADR-013 wrote the backup *procedure*; nothing ran it. These two services are the runner.
  # They are deliberately **one-shot, profile-gated containers, not an always-on scheduler**:
  # on a 6-core single server another resident process would duplicate a scheduler the host
  # already has (systemd timers / cron), with worse failure semantics. A one-shot container
  # exits with the script's status, so `OnFailure=` on a systemd timer sees a failed backup —
  # a sleeping loop inside a container would swallow it. The host timer unit is in
  # docs/runbooks/operations.md.
  #
  #   docker compose run --rm backup                    # take one backup
  #   docker compose run --rm restore-check             # back up, then restore that backup
  #   docker compose run --rm --no-deps restore-check   # restore the newest object already stored
  #   docker compose --profile backup up -d             # both, in order (backup, then rehearsal)
  #
  # Use `-d` for the third form: plain `up` also attaches to postgres/minio, which never exit,
  # so the command would not return. Read the result with `docker compose logs backup`.
  #
  # The image is the API image plus pg_dump/psql/openssl (`backup` build target). The API image
  # itself still ships none of them — ADR-013's "the stateless API image carries no database
  # client" holds, because this is a different image built from a later stage.
  backup:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: backup
    environment:
      <<: *application_environment
      # Development passphrase only. Production reads this from the server's secret manager;
      # it is never committed. See .env.example.
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-socialpilot_local_only_backup_passphrase}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-backups/}
      BACKUP_RETENTION_DAILY_DAYS: ${BACKUP_RETENTION_DAILY_DAYS:-14}
      BACKUP_RETENTION_WEEKLY_WEEKS: ${BACKUP_RETENTION_WEEKLY_WEEKS:-8}
      BACKUP_S3_TIMEOUT_SECONDS: ${BACKUP_S3_TIMEOUT_SECONDS:-300}
    command: ["python", "-m", "scripts.backup_db"]
    profiles: ["backup"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # `edge` is not optional in production: the whole point is that the ciphertext leaves the
    # box, and R2/S3 is reached over the internet. `backend` is how it reaches PostgreSQL.
    networks: [backend, edge]
    # Lowest CPU weight, alongside beat and minio-init: gzip and openssl are CPU-bound, and a
    # nightly backup must never be the reason an API request or a query waits. The ceiling is
    # one core because the pipeline is single-threaded end to end. The dump is streamed through
    # a temporary directory that the script removes in `finally`, so /tmp is the only writable
    # surface it needs; 1 GB covers a dump far larger than anything this system has.
    cpus: 1.0
    mem_limit: 512m
    cpu_shares: 128
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    restart: "no"

  # An untested backup is not a backup (ADR-013). This rehearses the real thing: newest object
  # from storage → decrypt → gunzip → load into a throwaway database → assert the Alembic head
  # and core row counts.
  #
  # The scratch database is recreated in the entrypoint rather than inside restore_check.py, on
  # purpose. `DROP DATABASE` is a verb that must be visible where it is wired, not hidden behind
  # an environment flag that someone could set on a production host. The database *name* is a
  # literal here and cannot be redirected by any variable; only the server it is created on
  # follows the DSN.
  restore-check:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: backup
    environment:
      <<: *application_environment
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-socialpilot_local_only_backup_passphrase}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-backups/}
      BACKUP_S3_TIMEOUT_SECONDS: ${BACKUP_S3_TIMEOUT_SECONDS:-300}
      RESTORE_CHECK_DATABASE_URL: postgresql://socialpilot:socialpilot_local_only@postgres:5432/socialpilot_restore_check
      RESTORE_CHECK_ADMIN_DSN: postgresql://socialpilot:socialpilot_local_only@postgres:5432/postgres
    entrypoint:
      - sh
      - -c
      - |
        set -e
        psql "$$RESTORE_CHECK_ADMIN_DSN" -v ON_ERROR_STOP=1 -q \
          -c 'DROP DATABASE IF EXISTS socialpilot_restore_check WITH (FORCE)'
        psql "$$RESTORE_CHECK_ADMIN_DSN" -v ON_ERROR_STOP=1 -q \
          -c 'CREATE DATABASE socialpilot_restore_check'
        exec python -m scripts.restore_check
    profiles: ["backup"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      # The whole loop in order: take a backup, then restore that same backup. `run` starts
      # dependencies too, so this holds for `run --rm restore-check` as well; `--no-deps`
      # rehearses whatever is already newest in storage instead.
      backup:
        condition: service_completed_successfully
    networks: [backend, edge]
    # Same budget and the same reasoning as `backup`; the rehearsal additionally loads a dump
    # into PostgreSQL, and that work is charged to the postgres service's own ceiling.
    cpus: 1.0
    mem_limit: 512m
    cpu_shares: 128
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    restart: "no"

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres_data:
  minio_data:
