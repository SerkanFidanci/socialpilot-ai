[build-system]
requires = ["setuptools>=75.0,<76.0"]
build-backend = "setuptools.build_meta"

[project]
name = "socialpilot-api"
version = "0.1.0"
description = "SocialPilot AI backend foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<1.15",
    "asyncpg>=0.29,<0.31",
    "celery>=5.4,<5.5",
    "fastapi>=0.115,<0.116",
    # Storage client: the S3-compatible adapter signs SigV4 requests over httpx rather than
    # adding a synchronous vendor SDK to an async request path.
    "httpx>=0.27,<0.29",
    "pydantic-settings>=2.6,<3.0",
    "redis>=5.2,<6.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "structlog>=24.4,<25.0",
    "uvicorn[standard]>=0.30,<0.31",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<1.14",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "ruff>=0.8,<0.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "integration: requires PostgreSQL and Redis test services",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
