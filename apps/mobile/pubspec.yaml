name: socialpilot_mobile
description: "SocialPilot AI media analysis demo client."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Streams request bodies from disk so a large MP4 is never buffered in memory.
  http: ^1.2.2
  # Returns a file path rather than bytes, keeping large videos off the heap.
  file_picker: ^8.1.6
  # Chunked SHA-256 so the checksum never requires the whole file in memory.
  crypto: ^3.0.6
  convert: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
