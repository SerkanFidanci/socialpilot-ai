---
name: Verify

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

env:
  # uv version is pinned; renovate keeps it and the lockfile in step.
  UV_VERSION: "0.11.31"

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: socialpilot
          POSTGRES_USER: socialpilot
          POSTGRES_PASSWORD: socialpilot_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socialpilot -d socialpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://socialpilot:socialpilot_local_only@localhost:5432/socialpilot
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      DATABASE_CONNECT_TIMEOUT_SECONDS: 5
      REDIS_CONNECT_TIMEOUT_SECONDS: 5
      REQUEST_TIMEOUT_SECONDS: 10
      CELERY_TASK_TIMEOUT_SECONDS: 300
      RUN_INTEGRATION_TESTS: 1
      # Resolve and run against exactly this interpreter; uv provisions it from the lockfile's
      # requires-python (>=3.13) without touching the runner's system Python.
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install and verify media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install backend dependencies (locked)
        working-directory: services/api
        run: uv sync --locked --all-extras
      - name: Put the project environment on PATH
        run: echo "${{ github.workspace }}/services/api/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: make lint
      - name: Format check
        run: make format-check
      - name: Test backend
        run: make test-backend
      - name: Type check
        working-directory: services/api
        run: mypy .
      - name: Validate migrations
        working-directory: services/api
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Verify OpenAPI contract
        run: make check-openapi
      - name: Validate Compose definition
        run: docker compose config

  # Dependency vulnerability scan (PRD §33.5 "Dependency scanning", §41.1 "Security scan").
  # Threshold: any advisory in the PyPA/OSV database for a locked dependency fails the build.
  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Export the locked dependency set
        working-directory: services/api
        run: >-
          uv export --locked --no-emit-project --all-extras --no-hashes
          --format requirements-txt > requirements-audit.txt
      - name: Audit dependencies for known vulnerabilities
        working-directory: services/api
        run: uvx pip-audit --requirement requirements-audit.txt --strict --progress-spinner off

  # Secret scan across the full git history (PRD §33.5 "Secret scanning").
  # Threshold: any gitleaks finding — in the working tree or any historical commit — fails the
  # build. Known development-only placeholders are allowlisted in .gitleaks.toml.
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan git history for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
          ./gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1

  # Container image scan (PRD §33.5 "Container scanning").
  # Threshold: a fixable CRITICAL OS/library vulnerability in the built API image fails the
  # build. Unfixed findings are reported but do not block, since no upgrade can clear them.
  container-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f services/api/Dockerfile -t socialpilot-api:${{ github.sha }} .
      - name: Scan the image for OS and library vulnerabilities (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: socialpilot-api:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
